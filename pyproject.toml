[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsletter-engine"
version = "0.1.0"
description = "RAG pipeline: monthly meeting content in, enterprise technical newsletter out"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "pypdf>=4.2",
    "chromadb>=0.5",
    "anthropic>=0.40",
    "openai>=1.40",
    "jinja2>=3.1",
    "playwright>=1.45",
    "structlog>=24.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[project.scripts]
newsletter = "newsletter_engine.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
newsletter_engine = ["rendering/templates/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
